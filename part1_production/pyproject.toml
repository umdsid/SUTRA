[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "strata-tissue"
version = "0.2.0"
description = "STRATA — Spatial Transcriptomic Relational Analysis of Tissue Architecture"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.0",
  "pandas>=2.2",
  "scipy>=1.13",
  "h5py>=3.11",
  "pyarrow>=16",
  "shapely>=2.0",
  "tifffile>=2024.8.10",
]

[project.optional-dependencies]
dev = ["pytest>=8.2"]

[project.scripts]
strata-tranche1 = "strata.cli.tranche1:main"
strata-discover = "strata.cli.discover:main"

[tool.setuptools.packages.find]
where = ["src"]
