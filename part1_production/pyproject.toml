[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "sutra-spatial"
version = "1.0.0"
description = "Spatial Unified Transcriptomic Reconstruction and Analysis"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0",
    "pandas>=2.2",
    "scipy>=1.13",
    "h5py>=3.11",
    "pyarrow>=16",
    "shapely>=2.0",
    "tifffile>=2024.8.10",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["sutra*"]
